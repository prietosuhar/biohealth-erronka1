gh_edit_repository: "https://github.com/prietosuhar/biohealth-erronka1"
gh_edit_branch: "main"
gh_edit_view_mode: "edit"

back_to_top: true
back_to_top_text: "Gora ↑"
heading_anchors: true

footer_content: "BioHealth – Erronka 1 · Uni Center · SISA2 2026/27 · Gaizka · Alex · Garazi · Suhar"

# Ez argitaratu
exclude:
  - README.md
  - irudiak/HW/Biohealth_HW.md
  - docs/HW-hardwarea/HW-txostena
  - Gemfile
  - Gemfile.lock
  - vendor
