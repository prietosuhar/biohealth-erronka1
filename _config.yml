title: BioHealth – Erronka 1
description: Uni Center · SISA2 2026/27 · Azpiegituraren dokumentazioa
lang: eu

# Gaia: Just the Docs (GitHub Pages-en remote_theme bidez)
remote_theme: just-the-docs/just-the-docs@v0.10.1
plugins:
  - jekyll-remote-theme
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings

logo: "/irudiak/logo/biohealth-logo.png"
favicon_ico: "/irudiak/logo/biohealth-ikonoa.png"
